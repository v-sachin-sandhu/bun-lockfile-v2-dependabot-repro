---
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Singapore"
    commit-message:
      prefix: "build"
    groups:
      app-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
